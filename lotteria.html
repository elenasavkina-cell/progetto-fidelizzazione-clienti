<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Lotteria: Vinci una crociera</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(135deg,#1f3c88,#4e9af1);color:#132743}
    .container{max-width:900px;margin:40px auto;padding:24px;background:#f7f9fc;border-radius:22px;box-shadow:0 20px 44px rgba(0,0,0,.20)}
    .header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
    .title{margin:0;font-size:28px;letter-spacing:.04em;text-transform:uppercase;color:#1f3c88}
    .subtitle{margin:4px 0 0;font-size:14px;color:#4b5b82}
    .card{background:#fff;border-radius:18px;padding:18px 20px 20px;box-shadow:0 12px 28px rgba(15,23,42,.10);margin-bottom:16px}
    .card-title{font-size:18px;font-weight:600;color:#1f2937;margin:0 0 10px}
    .tickets{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
    .ticket{border:1px dashed #cbd5e1;border-radius:14px;padding:12px;background:#fff}
    .ticket h3{margin:0 0 6px;font-size:16px;color:#1f2937}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .btn{border:none;border-radius:999px;padding:10px 16px;font-size:14px;cursor:pointer}
    .btn-primary{background:#4f46e5;color:#fff;box-shadow:0 12px 26px rgba(79,70,229,.35)}
    .pill{display:inline-block;padding:6px 12px;border-radius:999px;background:#e5e7eb}
    .note{font-size:12px;color:#6b7280}
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1 class="title">Vinci una crociera</h1>
        <p class="subtitle">Lotteria riservata ai clienti storici.</p>
      </div>
      <span id="drawDate" class="subtitle"></span>
    </div>

    <section class="card">
      <h2 class="card-title">Congratulazioni</h2>
      <p class="note"><span class="pill">Punti cumulati: <strong id="lifePts">0</strong></span></p>
      <p class="note" id="eligMsg">—</p>
    </section>

    <section class="card">
      <h2 class="card-title">Partecipa ora</h2>
      <p class="note">Ogni cliente storico può generare un biglietto. Più inviti validi = più biglietti.</p>
      <div class="row" style="margin-top:10px">
        <button id="joinBtn" class="btn btn-primary">Genera biglietto</button>
        <span class="pill">I tuoi biglietti: <strong id="count">0</strong></span>
        <span class="pill">Crociere completate: <strong id="trips">0</strong></span>
      </div>
      <div id="msg" class="note" style="margin-top:10px"></div>
    </section>

    <section class="card">
      <h2 class="card-title">I tuoi biglietti</h2>
      <div id="list" class="tickets"></div>
    </section>
  </div>

  <script>
    const CFG={LOTTERY_TRIPS_REQUIRED:3,LOTTERY_POINTS_REQUIRED:3000,PUBLICATION_DAYS:30};
    function getCfg(){
      try{
        const v=localStorage.getItem("pf_lottery_cfg");
        if(!v) return CFG;
        const o=JSON.parse(v);
        return {
          LOTTERY_TRIPS_REQUIRED:o.LOTTERY_TRIPS_REQUIRED??CFG.LOTTERY_TRIPS_REQUIRED,
          LOTTERY_POINTS_REQUIRED:o.LOTTERY_POINTS_REQUIRED??CFG.LOTTERY_POINTS_REQUIRED,
          PUBLICATION_DAYS:o.PUBLICATION_DAYS??CFG.PUBLICATION_DAYS
        };
      }catch(e){return CFG}
    }
    function nextQuarter(){
      const d=new Date();const m=d.getMonth();
      const q=Math.floor(m/3);
      const nextStart=new Date(d.getFullYear(),(q+1)*3,1);
      return nextStart.toLocaleDateString();
    }
    function drawDateText(){
      const v=localStorage.getItem("pf_lottery_drawDate");
      if(!v) return nextQuarter();
      const d=new Date(parseInt(v,10));
      return d.toLocaleDateString();
    }
    function getLife(){return parseInt(localStorage.getItem("pf_pointsLifetime")||"0",10)}
    function getTrips(){return parseInt(localStorage.getItem("pf_trips")||"0",10)}
    function getTickets(){
      try{
        return JSON.parse(localStorage.getItem("pf_lotteryTickets")||"[]");
      }catch(e){return []}
    }
    function saveTickets(arr){
      localStorage.setItem("pf_lotteryTickets",JSON.stringify(arr));
    }
    function render(){
      const arr=getTickets();
      document.getElementById("count").textContent=String(arr.length);
      const list=document.getElementById("list");
      list.innerHTML="";
      arr.forEach(t=>{
        const d=document.createElement("div");
        d.className="ticket";
        d.innerHTML='<h3>Biglietto #'+t.id+'</h3><div class="note">Emesso: '+new Date(t.ts).toLocaleString()+'</div>';
        list.appendChild(d);
      });
    }
    function join(){
      const trips=getTrips();
      const life=getLife();
      const C=getCfg();
      const byTrips=trips>=C.LOTTERY_TRIPS_REQUIRED;
      const byPoints=life>=C.LOTTERY_POINTS_REQUIRED;
      if(!(byTrips||byPoints)){
        document.getElementById("msg").textContent="Non idoneo: servono almeno "+C.LOTTERY_TRIPS_REQUIRED+" crociere oppure "+C.LOTTERY_POINTS_REQUIRED+" punti cumulati. Attuali: crociere "+trips+", punti "+life+".";
        return;
      }
      const arr=getTickets();
      const id=String(Math.floor(100000+Math.random()*899999));
      arr.push({id:id,ts:Date.now()});
      saveTickets(arr);
      document.getElementById("msg").textContent="Buona fortuna! Biglietto "+id+" generato. Il vincitore verrà pubblicato entro "+C.PUBLICATION_DAYS+" giorni oppure in data comunicata.";
      render();
    }
    document.addEventListener("DOMContentLoaded",function(){
      document.getElementById("drawDate").textContent="Prossima estrazione: "+drawDateText();
      render();
      const life=getLife();
      document.getElementById("lifePts").textContent=String(life);
      document.getElementById("trips").textContent=String(getTrips());
      const trips=getTrips();
      const C=getCfg();
      const byTrips=trips>=C.LOTTERY_TRIPS_REQUIRED;
      const byPoints=life>=C.LOTTERY_POINTS_REQUIRED;
      const msg=byTrips||byPoints
        ?"Congratulazioni! Sei idoneo a partecipare alla lotteria. Genera il tuo biglietto."
        :"Per partecipare: raggiungi "+C.LOTTERY_TRIPS_REQUIRED+" crociere oppure "+C.LOTTERY_POINTS_REQUIRED+" punti cumulati.";
      document.getElementById("eligMsg").textContent=msg;
      document.getElementById("joinBtn").addEventListener("click",join);
    });
  </script>
</body>
</html>
