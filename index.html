<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Gestionale partecipanti</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background-color: #f4f4f4;
  margin: 0;
  padding: 24px;
}
.container {
  max-width: 1000px;
  margin: 0 auto;
  background-color: #ffffff;
  padding: 24px;
  border-radius: 8px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
}
h1 {
  font-size: 1.8rem;
  margin: 0 0 8px 0;
}
h2 {
  font-size: 1.2rem;
  margin: 0;
}
.subtitle {
  font-size: 0.9rem;
  color: #555555;
  margin-bottom: 20px;
}
.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
button {
  cursor: pointer;
}
.btn {
  padding: 6px 12px;
  border-radius: 4px;
  font-size: 0.9rem;
  border: 1px solid transparent;
}
.btn-primary {
  background-color: #0044cc;
  color: #ffffff;
}
.btn-secondary {
  background-color: #ffffff;
  color: #0044cc;
  border-color: #0044cc;
}
.btn-danger {
  background-color: #cc0000;
  color: #ffffff;
}
.btn + .btn {
  margin-left: 4px;
}
form {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-bottom: 16px;
}
label {
  font-size: 0.9rem;
}
input[type="text"] {
  padding: 6px 8px;
  border-radius: 4px;
  border: 1px solid #cccccc;
  min-width: 220px;
}
table {
  width: 100%;
  border-collapse: collapse;
  background-color: #ffffff;
}
thead {
  background-color: #f0f2f5;
}
th,
td {
  border: 1px solid #dddddd;
  padding: 8px;
  font-size: 0.9rem;
  vertical-align: middle;
}
th {
  text-align: left;
}
tr:nth-child(even) tbody tr {
  background-color: #f9f9f9;
}
.nome-confermato {
  color: #003399;
  font-weight: 600;
}
.nome-da-contabilizzare {
  color: #cc0000;
  font-weight: 600;
}
.nome-preso-in-carico {
  color: #cc6600;
  font-weight: 600;
}
.status-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 12px;
  font-size: 0.8rem;
}
.status-confermato {
  background-color: #0044cc;
  color: #ffffff;
}
.status-da-contabilizzare {
  background-color: #ffcccc;
  color: #660000;
}
.status-preso-in-carico {
  background-color: #ffdd99;
  color: #663300;
}
.nota {
  font-size: 0.85rem;
}
.legend {
  font-size: 0.8rem;
  color: #555555;
  margin-top: 12px;
}
.legend span {
  display: inline-flex;
  align-items: center;
  margin-right: 12px;
}
.legend-color {
  display: inline-block;
  width: 14px;
  height: 14px;
  border-radius: 3px;
  margin-right: 4px;
}
.legend-confermato {
  background-color: #0044cc;
}
.legend-da-contabilizzare {
  background-color: #ffcccc;
  border: 1px solid #660000;
}
.legend-preso-in-carico {
  background-color: #ffdd99;
  border: 1px solid #663300;
}
@media (max-width: 640px) {
  .toolbar {
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
  }
  form {
    flex-direction: column;
    align-items: flex-start;
  }
  input[type="text"] {
    width: 100%;
  }
  input[type="file"] {
    width: 100%;
  }
}
@media print {
  body {
    background-color: #ffffff;
    padding: 0;
  }
  .container {
    box-shadow: none;
    margin: 0;
    padding: 0;
    max-width: none;
  }
  form,
  .toolbar,
  .btn,
  th:last-child,
  td:last-child {
    display: none;
  }
}
</style>
</head>
<body>
<div class="container">
<h1>Gestionale partecipanti</h1>
<p class="subtitle">Lista pubblica per i clienti: verifica stato e inoltro copia contabile.</p>
<div class="toolbar">
<h2>Lista partecipanti</h2>
<button type="button" class="btn btn-primary" onclick="window.print()">Esporta in PDF</button>
</div>
<form id="add-participant-form">
<div style="display:flex; flex-direction:column; gap:4px;">
  <label for="nome-partecipante">Nome partecipante</label>
  <input type="text" id="nome-partecipante" autocomplete="off" required>
</div>
<div style="display:flex; flex-direction:column; gap:4px;">
  <label for="copia-contabile">Copia contabile (Bonifico)</label>
  <input type="file" id="copia-contabile" accept="application/pdf,image/*">
</div>
<button type="submit" class="btn btn-secondary" style="margin-top: 20px;">Invia dati e copia contabile</button>
</form>
<table>
<thead>
<tr>
<th>Nome</th>
<th>Stato</th>
<th>Nota</th>
<th>Azioni</th>
</tr>
</thead>
<tbody id="partecipanti-body"></tbody>
</table>
<div class="legend">
<span><span class="legend-color legend-confermato"></span>Confermato (blu intenso) – pronto per PDF</span>
<span><span class="legend-color legend-da-contabilizzare"></span>Nuovo bonifico (rosso chiaro) – Da contabilizzare</span>
<span><span class="legend-color legend-preso-in-carico"></span>Bonifico preso in carico</span>
</div>
</div>
<script>
const STATUS = {
  CONFIRMATO: "CONFIRMATO",
  DA_CONTABILIZZARE: "DA_CONTABILIZZARE",
  PRESO_IN_CARICO: "PRESO_IN_CARICO"
};
let partecipanti = [
  { id: 1, nome: "Mario Rossi", status: STATUS.CONFIRMATO },
  { id: 2, nome: "Anna Bianchi", status: STATUS.CONFIRMATO },
  { id: 3, nome: "Luca Verdi", status: STATUS.DA_CONTABILIZZARE }
];
function getNomeClass(status) {
  if (status === STATUS.CONFIRMATO) {
    return "nome-confermato";
  }
  if (status === STATUS.DA_CONTABILIZZARE) {
    return "nome-da-contabilizzare";
  }
  if (status === STATUS.PRESO_IN_CARICO) {
    return "nome-preso-in-carico";
  }
  return "";
}
function getStatusBadgeClass(status) {
  if (status === STATUS.CONFERMATO) {
    return "status-badge status-confermato";
  }
  if (status === STATUS.DA_CONTABILIZZARE) {
    return "status-badge status-da-contabilizzare";
  }
  if (status === STATUS.PRESO_IN_CARICO) {
    return "status-badge status-preso-in-carico";
  }
  return "status-badge";
}
function getStatusLabel(status) {
  if (status === STATUS.CONFERMATO) {
    return "Confermato";
  }
  if (status === STATUS.DA_CONTABILIZZARE) {
    return "Da contabilizzare";
  }
  if (status === STATUS.PRESO_IN_CARICO) {
    return "Preso in carico";
  }
  return "";
}
function getNota(status) {
  if (status === STATUS.DA_CONTABILIZZARE) {
    return "Da contabilizzare";
  }
  if (status === STATUS.PRESO_IN_CARICO) {
    return "Il bonifico è stato preso in carico";
  }
  return "";
}
function aggiornaStato(id, nuovoStato) {
  partecipanti = partecipanti.map(function (p) {
    if (p.id === id) {
      return { id: p.id, nome: p.nome, status: nuovoStato };
    }
    return p;
  });
  renderPartecipanti();
}
function renderPartecipanti() {
  const tbody = document.getElementById("partecipanti-body");
  tbody.innerHTML = "";
  partecipanti.forEach(function (p) {
    const tr = document.createElement("tr");
    const tdNome = document.createElement("td");
    tdNome.textContent = p.nome;
    tdNome.className = getNomeClass(p.status);
    const tdStato = document.createElement("td");
    const spanStato = document.createElement("span");
    spanStato.className = getStatusBadgeClass(p.status);
    spanStato.textContent = getStatusLabel(p.status);
    tdStato.appendChild(spanStato);
    const tdNota = document.createElement("td");
    tdNota.textContent = getNota(p.status);
    tdNota.className = "nota";
    const tdAzioni = document.createElement("td");
    if (p.status === STATUS.DA_CONTABILIZZARE) {
      const btnPresoInCarico = document.createElement("button");
      btnPresoInCarico.type = "button";
      btnPresoInCarico.className = "btn btn-secondary";
      btnPresoInCarico.textContent = "Segna preso in carico";
      btnPresoInCarico.onclick = function () {
        aggiornaStato(p.id, STATUS.PRESO_IN_CARICO);
      };
      const btnConferma = document.createElement("button");
      btnConferma.type = "button";
      btnConferma.className = "btn btn-primary";
      btnConferma.textContent = "Conferma bonifico";
      btnConferma.onclick = function () {
        aggiornaStato(p.id, STATUS.CONFERMATO);
      };
      tdAzioni.appendChild(btnPresoInCarico);
      tdAzioni.appendChild(btnConferma);
    } else if (p.status === STATUS.PRESO_IN_CARICO) {
      const btnConferma = document.createElement("button");
      btnConferma.type = "button";
      btnConferma.className = "btn btn-primary";
      btnConferma.textContent = "Conferma bonifico";
      btnConferma.onclick = function () {
        aggiornaStato(p.id, STATUS.CONFERMATO);
      };
      tdAzioni.appendChild(btnConferma);
    }
    tr.appendChild(tdNome);
    tr.appendChild(tdStato);
    tr.appendChild(tdNota);
    tr.appendChild(tdAzioni);
    tbody.appendChild(tr);
  });
}
function inizializzaForm() {
  const form = document.getElementById("add-participant-form");
  const inputNome = document.getElementById("nome-partecipante");
  const inputFile = document.getElementById("copia-contabile");
  form.addEventListener("submit", function (event) {
    event.preventDefault();
    const nome = inputNome.value.trim();
    if (!nome) {
      return;
    }
    const file = inputFile.files[0];
    const nuovo = {
      id: Date.now(),
      nome: nome,
      status: STATUS.DA_CONTABILIZZARE
    };
    partecipanti.push(nuovo);
    inputNome.value = "";
    inputFile.value = "";
    inputNome.focus();
    renderPartecipanti();
    if (file) {
      alert("Partecipante aggiunto e copia contabile inviata con successo!");
    }
  });
}
inizializzaForm();
renderPartecipanti();
</script>
</body>
</html>
